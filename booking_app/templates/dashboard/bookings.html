{% extends "dashboard/dashabordBase.html" %}
{% block dashboardContent %}

<h2 class="page-title">Bookings</h2>

<table class="table table-hover bg-white shadow-sm">
  <thead class="table-success">
    <tr>
      <th>Name</th>
      <th>Hotel</th>
      <th>Dates</th>
      <th>Status</th>
      <th>Action</th>
    </tr>
  </thead>

  <tbody>
    {% for b in bookings %}
    <tr>
      <td>{{ b.customer_name }}</td>
      <td>{{ b.hotel.name }}</td>
      <td>{{ b.check_in_date }} → {{ b.check_out_date }}</td>
      <td>
        <span class="badge bg-success">{{ b.status }}</span>
      </td>
      <td>
        <form method="POST" action="{% url 'update_booking' b.id %}">
          {% csrf_token %}
          <select name="status" class="form-select mb-1">
            <option value="pending">Pending</option>
            <option value="approved">Approved</option>
            <option value="rejected">Rejected</option>
          </select>
          <button class="btn btn-success btn-sm">Update</button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>

{% endblock %}
