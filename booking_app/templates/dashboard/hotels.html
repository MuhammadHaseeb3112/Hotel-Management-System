{% extends "dashboard/dashabordBase.html" %}
{% block dashboardContent %}

<div class="d-flex justify-content-between align-items-center mb-3">
  <h2 class="page-title">Hotels</h2>
  <a href="{% url 'add_hotel' %}" class="btn btn-success">+ Add Hotel</a>
</div>

<table class="table table-hover shadow-sm bg-white">
  <thead class="table-success">
    <tr>
      <th>Name</th>
      <th>City</th>
      <th>Price</th>
      <th>Rooms</th>
      <th>Actions</th>
    </tr>
  </thead>

  <tbody>
    {% for hotel in hotels %}
    <tr>
      <td>{{ hotel.name }}</td>
      <td>{{ hotel.city }}</td>
      <td>Rs {{ hotel.price_per_night }}</td>
      <td>{{ hotel.number_of_rooms }}</td>
      <td>
        <a href="{% url 'edit_hotel' hotel.id %}" class="btn btn-sm btn-primary">Edit</a>
        <a href="{% url 'delete_hotel' hotel.id %}" class="btn btn-sm btn-danger">Delete</a>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>

{% endblock %}
