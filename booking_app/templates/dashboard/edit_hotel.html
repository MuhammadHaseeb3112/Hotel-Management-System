{% block dashboardContent %}

<div class="container" style="max-width:900px;">

```
<h3 class="mb-4 text-center text-success">✏️ Edit Hotel</h3>

<form method="POST" enctype="multipart/form-data">
  {% csrf_token %}

  <!-- BASIC INFO -->
  <label class="form-label">Hotel Name</label>
  <input class="form-control mb-3" name="name" value="{{ hotel.name }}">

  <label class="form-label">City</label>
  <input class="form-control mb-3" name="city" value="{{ hotel.city }}">

  <label class="form-label">Price per Night</label>
  <input class="form-control mb-3" name="price" value="{{ hotel.price_per_night }}">

  <label class="form-label">Number of Rooms</label>
  <input class="form-control mb-3" name="rooms" value="{{ hotel.number_of_rooms }}">

  <label class="form-label">Address</label>
  <textarea class="form-control mb-3" name="address">{{ hotel.address }}</textarea>

  <label class="form-label">Amenities</label>
  <input class="form-control mb-3" name="amenities"
         value="{{ hotel.amenities|join:', ' }}">

  <!-- ACTIVE -->
  <div class="form-check mb-3">
    <input class="form-check-input" type="checkbox" name="default"
           {% if hotel.default %}checked{% endif %}>
    <label class="form-check-label">Active (Default)</label>
  </div>

  <!-- CURRENT IMAGES -->
  <h5 class="mt-3">Hotel Images</h5>

  <div class="d-flex flex-wrap mb-3">
    {% for img in hotel.images %}
    <div style="margin:10px; text-align:center;">

      <img src="{{ img }}"
           style="width:120px;height:100px;object-fit:cover;border-radius:8px;">

      <!-- DELETE CHECKBOX -->
      <div class="form-check mt-1">
        <input class="form-check-input"
               type="checkbox"
               name="delete_images"
               value="{{ img }}">
        <label class="form-check-label text-danger">
          Delete
        </label>
      </div>

    </div>
    {% empty %}
    <p class="text-muted">No images uploaded</p>
    {% endfor %}
  </div>

  <!-- ADD NEW IMAGES -->
  <label class="form-label">Add More Images</label>
  <input type="file" name="images" multiple class="form-control mb-3"
         onchange="previewImages(event)">

  <!-- PREVIEW -->
  <div id="preview-container" class="d-flex flex-wrap mb-3"></div>

  <!-- SUBMIT -->
  <button class="btn w-100 text-white"
          style="background:linear-gradient(45deg,#16a34a,#22c55e);">
    Update Hotel
  </button>

</form>

<script>
function previewImages(event) {
  const container = document.getElementById("preview-container");
  container.innerHTML = "";

  Array.from(event.target.files).forEach(file => {
    const img = document.createElement("img");
    img.src = URL.createObjectURL(file);

    img.style.width = "100px";
    img.style.height = "100px";
    img.style.objectFit = "cover";
    img.style.margin = "5px";
    img.style.borderRadius = "8px";

    container.appendChild(img);
  });
}
</script>

{% endblock %}
