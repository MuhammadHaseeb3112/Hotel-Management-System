<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
  background: #f5f7fb;
  font-family: 'Segoe UI', sans-serif;
}

/* Sidebar */
.sidebar {
  height: 100vh;
  background: linear-gradient(180deg, #14532d, #052e16);
  color: white;
  padding: 20px;
}

.sidebar h4 {
  font-weight: bold;
  margin-bottom: 30px;
}

.sidebar a {
  display: block;
  color: #bbf7d0;
  margin: 12px 0;
  text-decoration: none;
  padding: 8px 12px;
  border-radius: 8px;
  transition: 0.3s;
}

.sidebar a:hover {
  background: #16a34a;
  color: white;
}

/* Cards */
.card {
  border-radius: 15px;
  border: none;
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-3px);
}

/* Buttons */
.btn-success {
  background: linear-gradient(45deg, #16a34a, #22c55e);
  border: none;
  border-radius: 8px;
}

.btn-success:hover {
  background: #15803d;
}

/* Table */
.table {
  border-radius: 12px;
  overflow: hidden;
}

/* Page Title */
.page-title {
  font-weight: 600;
  margin-bottom: 20px;
}
</style>
</head>

<body>

<div class="container-fluid">
  <div class="row">

    <!-- Sidebar -->
    <div class="col-md-2 sidebar">
      <h4>🌿 Hotel Admin</h4>

      <a href="{% url 'admin_dashboard' %}">Dashboard</a>
      <a href="{% url 'manage_hotels' %}">Hotels</a>
      <a href="{% url 'manage_bookings' %}">Bookings</a>

      <!-- NEW CONTACT MESSAGES LINK -->
      <a href="{% url 'contact_messages' %}">Contact Messages</a>

      <a href="/">Back to Site</a>
    </div>

    <!-- Main -->
    <div class="col-md-10 p-4">
      {% block dashboardContent %}{% endblock %}
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
