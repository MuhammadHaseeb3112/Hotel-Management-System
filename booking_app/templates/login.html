{% extends 'base.html' %}
{% load static %}

{% block title %}Login{% endblock %}

{% block content %}

<div class="login-container d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="login-form-container" style="width: 400px;">

        <h2 class="text-center mb-4">Login</h2>

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" class="form-control" name="username" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" name="password" required>
            </div>

            {% if form.errors %}
            <div class="alert alert-danger">
                Invalid username or password.
            </div>
            {% endif %}

            <button type="submit" class="btn btn-outline-success w-100">Login</button>

            <p class="mt-3 text-center">
                Don't have an account?
                <a href="{% url 'signup' %}">Sign up here</a>
            </p>

        </form>

    </div>
</div>

{% endblock %}



{% block scripts %}
<!-- Leave this block empty to prevent JavaScript from being included -->
{% endblock %}
